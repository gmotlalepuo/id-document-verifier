services:
  app:
    build:
      context: .
    image: id-document-verifier-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://159.198.70.41:6060

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: id_document_verifier
      DB_USERNAME: id_verifier
      DB_PASSWORD: id_verifier_password

      OCR_TESSERACT_PATH: tesseract
      OCR_PDFTOPPM_PATH: pdftoppm
      OCR_IMAGE_MAGICK_PATH: convert
      OCR_LANGUAGE: eng
      OCR_TIMEOUT: 180
      OCR_MIN_FIELD_SCORE: 0.82
      OCR_MAX_DOWNLOAD_MB: 15
      OCR_ALLOW_PRIVATE_URLS: "false"
      OCR_KEEP_FILES: "false"

      DOCUMENT_VERIFICATION_API_KEY: eyJhbGciOiJSUzI1NiIsInR
      RUN_MIGRATIONS: "true"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "6060:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: id_document_verifier
      MARIADB_USER: id_verifier
      MARIADB_PASSWORD: id_verifier_password
      MARIADB_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  mysql-data: