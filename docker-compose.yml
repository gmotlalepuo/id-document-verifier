services:
  app:
    build:
      context: .
      target: app
    image: id-document-verifier-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:6060}
      APP_KEY: ${APP_KEY:?Set APP_KEY in the Docker environment file}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-id_document_verifier}
      DB_USERNAME: ${DB_USERNAME:-id_verifier}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the Docker environment file}

      OCR_TESSERACT_PATH: tesseract
      OCR_PDFTOPPM_PATH: pdftoppm
      OCR_IMAGE_MAGICK_PATH: convert
      OCR_LANGUAGE: eng
      OCR_TIMEOUT: 180
      OCR_MIN_FIELD_SCORE: 0.82
      OCR_MAX_DOWNLOAD_MB: 15
      OCR_ALLOW_PRIVATE_URLS: "false"
      OCR_KEEP_FILES: "false"

      DOCUMENT_VERIFICATION_API_KEY: ${DOCUMENT_VERIFICATION_API_KEY:?Set DOCUMENT_VERIFICATION_API_KEY in the Docker environment file}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the Docker environment file}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in the Docker environment file}
      MCP_SERVER_NAME: ${MCP_SERVER_NAME:-id-document-verifier}
      MCP_SERVER_VERSION: ${MCP_SERVER_VERSION:-1.0.0}
      MCP_PROTOCOL_VERSION: ${MCP_PROTOCOL_VERSION:-2025-03-26}
      MCP_UPSTREAM_TIMEOUT: ${MCP_UPSTREAM_TIMEOUT:-15}
      MCP_EXECUTION_ENABLED: ${MCP_EXECUTION_ENABLED:-false}
      MCP_CONFIRMATION_TTL_SECONDS: ${MCP_CONFIRMATION_TTL_SECONDS:-300}
      MCP_AUDIT_RETENTION_DAYS: ${MCP_AUDIT_RETENTION_DAYS:-90}
      MCP_CONVERSATION_RETENTION_DAYS: ${MCP_CONVERSATION_RETENTION_DAYS:-30}
      MCP_ISSUE_LICENSE_WORKSPACE_ID: ${MCP_ISSUE_LICENSE_WORKSPACE_ID:-c730595e-9010-4b04-a90c-69edca895ac2}
      MCP_ISSUE_LICENSE_COLLECTION_ID: ${MCP_ISSUE_LICENSE_COLLECTION_ID:-789a28c0-8094-4f7e-9d7c-ba6ba602caeb}
      MCP_ISSUE_LICENSE_ENVIRONMENT_ID: ${MCP_ISSUE_LICENSE_ENVIRONMENT_ID:-c951fa51-33d4-471a-b2bd-9749c96b2d27}
      MCP_ISSUE_LICENSE_LOOKUP_REQUEST_ID: ${MCP_ISSUE_LICENSE_LOOKUP_REQUEST_ID:-a9758cea-ef5b-4527-aa2b-3140f36f4524}
      MCP_ISSUE_LICENSE_UPDATE_REQUEST_ID: ${MCP_ISSUE_LICENSE_UPDATE_REQUEST_ID:-105b8b1a-cee9-4e95-81c7-0b9f879f2f60}
      MCP_ISSUE_LICENSE_WORKFLOW_VERSION: ${MCP_ISSUE_LICENSE_WORKFLOW_VERSION:-1.0.0}
      BERZUDA_EXECUTION_URL: ${BERZUDA_EXECUTION_URL:?Set BERZUDA_EXECUTION_URL}
      MCP_INTERNAL_SIGNING_SECRET: ${MCP_INTERNAL_SIGNING_SECRET:?Set MCP_INTERNAL_SIGNING_SECRET}
      MCP_EXECUTION_TIMEOUT: ${MCP_EXECUTION_TIMEOUT:-45}

      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}

      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  scheduler:
    extends:
      service: app
    image: id-document-verifier-app
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_started

  nginx:
    build:
      context: .
      target: web
    image: id-document-verifier-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-6060}:80"
    depends_on:
      - app

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-id_document_verifier}
      MARIADB_USER: ${DB_USERNAME:-id_verifier}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the Docker environment file}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the Docker environment file}
    ports:
      - "${DB_PUBLISHED_HOST:-127.0.0.1}:${DB_PUBLISHED_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.5}
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.5}
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:1.5b}"]

volumes:
  app-storage:
  mysql-data:
  ollama-data:
